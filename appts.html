<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Appointments</title>
  <meta name="description" content="Book an appointment with Friends + Family." />

  <!-- shared subpage styles -->
  <link rel="stylesheet" href="css/subpages.css" />
  <link rel="stylesheet" href="css/global.css" />

  <!-- page-specific -->
  <link rel="stylesheet" href="css/appts.css" />
</head>

<body class="subpage appts-page">

  <!-- ✅ Global header injected here -->
  <div id="header"></div>

  <main class="wrap">

    <section class="box page-head">
      <h1 class="page-title">APPOINTMENTS</h1>
      <p class="subcopy">book a time • secure checkout handled by Square</p>
    </section>

    <!-- ✅ Box like Events items -->
    <section class="box appt-box" aria-label="Square booking">
      <div class="appt-embed">
        <iframe
          title="Square Appointments Booking"
          src="https://book.squareup.com/appointments/huc6rq6wnomq8z/location/LGVBXSS5TAJSW/services"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allow="payment *; clipboard-write; encrypted-media"
        ></iframe>
      </div>

      <!-- ✅ Always-works fallback -->
      <p class="appt-fallback">
        If the booking window doesn’t load, <a href="https://book.squareup.com/appointments/huc6rq6wnomq8z/location/LGVBXSS5TAJSW/services" target="_blank" rel="noopener">tap here to book in a new tab</a>.
      </p>
    </section>

  </main>

  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <!-- ✅ Load shared header/footer partials -->
  <script>
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>

</body>
</html>
