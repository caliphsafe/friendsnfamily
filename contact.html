<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Contact</title>
  <meta name="description" content="Contact Friends + Family." />

  <!-- shared subpage styles (header/footer/box) -->
  <link rel="stylesheet" href="css/subpages.css" />
  <!-- contact page styles -->
  <link rel="stylesheet" href="css/contact.css" />

     <!-- Shared header/footer CSS -->
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="subpage contact-page">

    <!-- ✅ GLOBAL HEADER -->
  <div id="header"></div>


  <main class="wrap">

    <!-- Page header -->
    <section class="box page-head">
      <h1 class="page-title">CONTACT</h1>
      <p class="subcopy">send a message • vendor inquiries • collabs • general questions</p>
    </section>

    <!-- Two-column layout (desktop) -->
    <section class="contact-grid">

      <!-- Left: Address / card -->
      <aside class="box contact-info">
        <div class="info-head">
          <div class="info-title">Friends + Family</div>
        </div>

        <div class="info-body">
          <div class="address-block">
            <div class="address-label">Address</div>
            <div class="address">
              1073 Massachusetts Ave<br />
              Cambridge, MA 02138
            </div>
          </div>

          <div class="mini-actions">
            <!-- ✅ NEW: Instagram action -->
            <a class="mini-action" href="https://www.instagram.com/friendsandfamilycambridge" target="_blank" rel="noopener">
              <span class="chip ig" aria-hidden="true"></span>View Instagram
            </a>

            <a class="mini-action" href="https://www.google.com/maps?q=1073+Massachusetts+Ave,+Cambridge,+MA+02138" target="_blank" rel="noopener">
              <span class="chip">📍</span>Open Map
            </a>
          </div>
        </div>
      </aside>

      <!-- Right: MySpace Message Composer -->
      <section class="box message-box" aria-label="Send a message to Friends + Family">
        <div class="msg-head">
          <div class="msg-title">Send Message</div>
        </div>

        <!-- mailto form (static-friendly) -->
        <form
          class="msg-form"
          action="mailto:friendsnfamily@gmail.com"
          method="post"
          enctype="text/plain"
        >
          <div class="row">
            <label class="lbl" for="name">Your Name</label>
            <input class="inp" id="name" name="Name" type="text" placeholder="Type your name" required />
          </div>

          <div class="row two">
            <div class="field">
              <label class="lbl" for="email">Email</label>
              <input class="inp" id="email" name="Email" type="email" placeholder="you@email.com" required />
            </div>
            <div class="field">
              <label class="lbl" for="phone">Contact Number</label>
              <input class="inp" id="phone" name="Phone" type="tel" placeholder="(555) 555-5555" />
            </div>
          </div>

          <div class="row">
            <label class="lbl" for="subject">Subject</label>
            <input class="inp" id="subject" name="Subject" type="text" placeholder="What’s this about?" />
          </div>

          <div class="row">
            <label class="lbl" for="message">Message</label>
            <textarea class="txt" id="message" name="Message" rows="8" placeholder="Write your message..." required></textarea>
          </div>

          <div class="send-row">
            <button class="btn" type="submit">Send</button>
            <button class="btn ghost" type="reset">Clear</button>
            <div class="hint">
              This opens your email app to send the message.
            </div>
          </div>
        </form>
      </section>

    </section>

  </main>

  <!-- ✅ GLOBAL FOOTER -->
  <div id="footer"></div>

  <!-- ✅ PARTIAL LOADER -->
  <script>
    fetch("partials/header.html")
      .then(r => r.text())
      .then(html => document.getElementById("header").innerHTML = html);

    fetch("partials/footer.html")
      .then(r => r.text())
      .then(html => document.getElementById("footer").innerHTML = html);
  </script>

</body>
</html>
