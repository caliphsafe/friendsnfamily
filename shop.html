<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Shop</title>
  <meta name="description" content="Shop Friends + Family via Square." />

  <link rel="stylesheet" href="css/shop.css" />
  <link rel="stylesheet" href="css/subpages.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="subpage shop-page">

  <!-- ✅ Global header injected here -->
  <div id="header"></div>

  <main class="wrap">

    <section class="box page-head">
      <h1 class="page-title">SHOP</h1>
      <p class="subcopy">online exclusives ❤️</p>
    </section>

    <br />

    <!-- ✅ Vendor dropdown (MySpace style box) -->
    <section class="box shop-subnav" aria-label="Shop vendors">
      <div class="shop-subnav-row">
        <label class="shop-label" for="vendorSelect">Vendor:</label>

        <!-- ✅ MANUAL VENDOR LIST -->
        <select id="vendorSelect" class="shop-select classic-select" aria-label="Select vendor">
          <option value="XQBO5JP5PC3AL7NIMSJZSSXZ">All Stores</option>

          <option value="OXNJJ7QYZZR35MTSB6SS4XGS">01 Mimimarie 🌀</option>
          <option value="EC4XOHBF2T5JXGBPJT5BX2N5">An Afternoon Affair</option>
          <option value="3BFANMYLNWRLST5APC6FSQIO">ariana thrifts</option>
          <option value="2PNU6MFXSNBNKY3R4TGKIJTU">BENNY ENZO!</option>
          <option value="UF5O54VFUT6NY2RIXS57QASA">Bohde</option>
          <option value="SYIZNM2GBQSMDRY2N4UQC62F">CAPO</option>
          <option value="YLAE2MTU3SU4MRSLKUCN7NYW">ELANDA</option>
          <option value="5HLLMOD75OS6KQ4WQR5KOYEJ">Female Hysteria</option>
          <option value="Z54RFAKIA3JK5LM35D7C5CMC">Follow the thread</option>
          <option value="KLGFQ4HME3QEDMMFPX6MQEVI">Ghostwriter</option>
          <option value="7W4TT3TK53D66X2EAIQTLABI">High Society</option>
          <option value="ORX3HSHPVCGMMR2IUHGDKEI4">Kickoutsoul</option>
          <option value="VQUDNWWQPM44TWF43M3KLVCU">Lady of Lizard</option>
          <option value="R24L2PXO4YMM4U3RZ7BKYSA2">LoveGrove</option>
          <option value="EFJLYMEOBFJH5RXW3OFMMVDI">Maia 🩷</option>
          <option value="JMXAT2WBXDI3RQIA6BJUFDQ6">Meera ☘️</option>
          <option value="UOOPGRVMHO46H3G3G3JTN65R">RUA</option>
          <option value="QBLTDOGEEW3WFTIM5OBEJAEY">strawbkiwi</option>
          <option value="CUGATFVIFNMR36VF5QHAMOLM">turbine</option>
        </select>

        <!-- ✅ Cart button goes to cart page -->
        <a id="cartBtn" class="btn-primary shop-cartbtn" href="cart.html">
          Cart (<span id="cartCount">0</span>)
        </a>
      </div>
    </section>

    <br />

    <!-- ✅ Products in a box -->
    <section class="box shop-products" aria-label="Products">
      <div id="shopStatus" class="shop-status">Loading shop…</div>
      <div id="productGrid" class="product-grid" hidden></div>
    </section>

    <!-- ✅ Item modal (opens on top; user stays on shop page) -->
    <div id="itemModal" class="item-modal" hidden>
      <div class="item-modal-backdrop" data-close></div>

      <div class="item-modal-card box" role="dialog" aria-modal="true" aria-label="Item details">
        <div class="item-modal-head">
          <div id="modalName" class="item-name"></div>
          <button class="item-modal-x" type="button" data-close aria-label="Close">×</button>
        </div>

        <div class="item-grid" style="padding:10px;">
          <div class="item-media">
            <!-- ✅ CAROUSEL WRAP -->
            <div id="modalImgWrap" class="modal-media">
              <button class="img-nav prev" type="button" data-prev aria-label="Previous image">‹</button>
              <div class="img-stage" id="imgStage"></div>
              <button class="img-nav next" type="button" data-next aria-label="Next image">›</button>
              <div class="img-dots" id="imgDots" aria-label="Image dots"></div>
            </div>
          </div>

          <div>
            <div id="modalPrice" class="item-price"></div>
            <div id="modalDesc" class="item-desc"></div>

            <div class="item-controls">
              <button id="modalAdd" class="btn-primary" type="button">Add to Cart</button>
              <a class="item-back" href="cart.html">Go to Cart</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ Fallback button 
    <section class="box shop-fallback" aria-label="Shop link fallback">
      <p style="margin:0 0 10px;">
        If the shop doesn’t load here, open it directly:
      </p>
      <a class="btn-primary" href="https://friends-and-fam-llc.square.site/" target="_blank" rel="noopener">
        OPEN SHOP IN NEW TAB
      </a>
    </section> -->

  </main>

  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <script>
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>

  <script>
  (function(){
    const API_BASE = "";

    /* ✅ Shop All category (only show these items by default) */
    const SHOP_ALL_ID = "XQBO5JP5PC3AL7NIMSJZSSXZ";

    const vendorSelect = document.getElementById("vendorSelect");
    const statusEl = document.getElementById("shopStatus");
    const grid = document.getElementById("productGrid");
    const cartCountEl = document.getElementById("cartCount");

    // modal refs
    const modal = document.getElementById("itemModal");
    const modalName = document.getElementById("modalName");
    const modalPrice = document.getElementById("modalPrice");
    const modalDesc = document.getElementById("modalDesc");
    const modalAdd = document.getElementById("modalAdd");

    // carousel refs
    const imgStage = document.getElementById("imgStage");
    const imgDots = document.getElementById("imgDots");
    const prevBtn = modal.querySelector("[data-prev]");
    const nextBtn = modal.querySelector("[data-next]");

    let lastItems = [];          // cache of currently loaded items
    let activeItem = null;       // item currently shown in modal
    let activeUrls = [];         // current carousel images
    let activeIdx = 0;

    function setStatus(msg){
      statusEl.textContent = msg;
      statusEl.hidden = false;
      grid.hidden = true;
    }
    function showGrid(){
      statusEl.hidden = true;
      grid.hidden = false;
    }

    // ✅ localStorage cart (persists across pages)
    function getCart(){
      try { return JSON.parse(localStorage.getItem("ff_cart") || "{}"); }
      catch { return {}; }
    }
    function setCart(cart){
      localStorage.setItem("ff_cart", JSON.stringify(cart));
    }
    function addToCart(variationId, snapshot){
      const cart = getCart();
      if (!cart[variationId]){
        cart[variationId] = { qty: 0, ...snapshot };
      }
      cart[variationId].qty += 1;
      setCart(cart);
      updateCartCount();
    }
    function updateCartCount(){
      const cart = getCart();
      const n = Object.values(cart).reduce((sum, x) => sum + (x.qty || 0), 0);
      cartCountEl.textContent = String(n);
    }

    // ✅ SAFER: handle APIs that return HTML error pages
    async function safeJsonFetch(url, opts){
      const r = await fetch(url, opts);
      const text = await r.text();
      let data = null;
      try { data = JSON.parse(text); } catch(e) {}

      if (!r.ok){
        const msg =
          (data && (data.error || data.message)) ||
          (text ? text.slice(0, 140).replace(/\s+/g, " ") : "Request failed");
        throw new Error(msg);
      }
      if (!data) throw new Error("API returned a non-JSON response.");
      return data;
    }
    async function apiGet(path){
      return safeJsonFetch(API_BASE + path);
    }

    function productCard(p){
      const imgInner = p.imageUrl
        ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy">`
        : `<div class="ph" aria-hidden="true"></div>`;

      const price = p.priceText || "";
      const vid = p.defaultVariationId;

      return `
        <article class="prod" data-itemid="${p.itemId}" data-vid="${vid || ""}">
          <button class="prod-link prod-view" type="button" data-view="${p.itemId}">
            <div class="prod-img">${imgInner}</div>
            <div class="prod-meta">
              <div class="prod-name">${p.name}</div>
              <div class="prod-price">${price}</div>
            </div>
          </button>

          <div class="prod-meta" style="padding-top:0;">
            <button class="prod-btn" type="button" data-add="${vid || ""}" ${vid ? "" : "disabled"}>
              ${vid ? "Add to cart" : "Unavailable"}
            </button>
          </div>
        </article>
      `;
    }

    async function loadItems(categoryId){
      setStatus("Loading items…");
      const q = categoryId ? `?categoryId=${encodeURIComponent(categoryId)}` : "";
      const data = await apiGet("/api/items" + q);
      const items = data.items || [];
      lastItems = items;

      grid.innerHTML = items.map(productCard).join("");
      showGrid();

      // open modal on view
      grid.querySelectorAll("[data-view]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-view");
          openItem(id);
        });
      });

      // add-to-cart from grid
      grid.querySelectorAll("[data-add]").forEach(btn => {
        btn.addEventListener("click", () => {
          const variationId = btn.getAttribute("data-add");
          if (!variationId) return;

          const card = btn.closest(".prod");
          const itemId = card?.getAttribute("data-itemid") || "";
          const item = lastItems.find(x => x.itemId === itemId);

          const snapshot = {
            itemId: item?.itemId || itemId,
            name: item?.name || "Item",
            priceText: item?.priceText || "",
            imageUrl: item?.imageUrl || "",
            imageUrls: item?.imageUrls || (item?.imageUrl ? [item.imageUrl] : []),
            availableQty: item?.defaultAvailableQty ?? 0
          };

          addToCart(variationId, snapshot);
          btn.textContent = "Added ✓";
          setTimeout(() => btn.textContent = "Add to cart", 700);
        });
      });
    }

    /* ===== Modal carousel helpers ===== */
    function renderCarousel(){
      // stage
      imgStage.innerHTML = activeUrls.length
        ? `<img src="${activeUrls[activeIdx]}" alt="${(activeItem?.name || "Item")}" loading="lazy">`
        : `<div class="ph" aria-hidden="true"></div>`;

      // arrows
      const showArrows = activeUrls.length > 1;
      prevBtn.style.display = showArrows ? "" : "none";
      nextBtn.style.display = showArrows ? "" : "none";

      // dots
      if (activeUrls.length > 1){
        imgDots.innerHTML = activeUrls.map((_, i) => {
          const on = i === activeIdx ? "on" : "";
          return `<button type="button" class="dot ${on}" data-dot="${i}" aria-label="Image ${i+1}"></button>`;
        }).join("");

        imgDots.querySelectorAll("[data-dot]").forEach(b => {
          b.addEventListener("click", () => {
            activeIdx = Number(b.getAttribute("data-dot")) || 0;
            renderCarousel();
          });
        });
      } else {
        imgDots.innerHTML = "";
      }
    }

    function goCarousel(n){
      if (activeUrls.length < 2) return;
      activeIdx = (n + activeUrls.length) % activeUrls.length;
      renderCarousel();
    }

    prevBtn.addEventListener("click", () => goCarousel(activeIdx - 1));
    nextBtn.addEventListener("click", () => goCarousel(activeIdx + 1));

    // ✅ modal controls
    function openItem(itemId){
      const item = lastItems.find(x => x.itemId === itemId);
      if (!item) return;

      activeItem = item;

      // ✅ name/price/desc
      modalName.textContent = item.name || "Item";
      modalPrice.textContent = item.priceText || "";
      modalDesc.textContent = item.description || "";

      // ✅ multi-image support (prefers imageUrls, falls back to imageUrl)
      const urls = Array.isArray(item.imageUrls) && item.imageUrls.length
        ? item.imageUrls
        : (item.imageUrl ? [item.imageUrl] : []);

      activeUrls = urls;
      activeIdx = 0;
      renderCarousel();

      modal.hidden = false;

      // keep URL param for share/back (optional)
      const u = new URL(location.href);
      u.searchParams.set("item", itemId);
      history.replaceState({}, "", u.toString());
    }

    function closeModal(){
      modal.hidden = true;
      activeItem = null;
      activeUrls = [];
      activeIdx = 0;

      // remove item param
      const u = new URL(location.href);
      u.searchParams.delete("item");
      history.replaceState({}, "", u.toString());
    }

    // close handlers
    modal.addEventListener("click", (e) => {
      if (e.target && e.target.hasAttribute("data-close")) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (!modal.hidden && e.key === "Escape") closeModal();
      if (!modal.hidden && e.key === "ArrowLeft") goCarousel(activeIdx - 1);
      if (!modal.hidden && e.key === "ArrowRight") goCarousel(activeIdx + 1);
    });

    modalAdd.addEventListener("click", () => {
      if (!activeItem?.defaultVariationId) return;

      const snapshot = {
        itemId: activeItem.itemId,
        name: activeItem.name || "Item",
        priceText: activeItem.priceText || "",
        imageUrl: activeItem.imageUrl || "",
        imageUrls: activeItem.imageUrls || (activeItem.imageUrl ? [activeItem.imageUrl] : []),
        availableQty: activeItem.defaultAvailableQty ?? 0
      };

      addToCart(activeItem.defaultVariationId, snapshot);
      modalAdd.textContent = "Added ✓";
      setTimeout(() => modalAdd.textContent = "Add to Cart", 700);
    });

    vendorSelect.addEventListener("change", () => {
      const id = vendorSelect.value || SHOP_ALL_ID;

      const u = new URL(location.href);

      // ✅ clean URL when on Shop All
      if (id === SHOP_ALL_ID) u.searchParams.delete("vendor");
      else u.searchParams.set("vendor", id);

      history.replaceState({}, "", u.toString());
      loadItems(id);
    });

    (async function init(){
      try{
        updateCartCount();

        const params = new URLSearchParams(location.search);

        // ✅ DEFAULT to Shop All category if no vendor param
        const vendorFromUrl = params.get("vendor") || SHOP_ALL_ID;
        const itemFromUrl = params.get("item") || "";

        // ✅ set dropdown + load items
        vendorSelect.value = vendorFromUrl;
        await loadItems(vendorFromUrl);

        // if direct-linked to an item, open it after items load
        if (itemFromUrl){
          openItem(itemFromUrl);
        }

      } catch(e){
        setStatus("Shop failed to load: " + e.message);
      }
    })();
  })();
  </script>

</body>
</html>
