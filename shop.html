  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <script>
    // ✅ Load shared header/footer partials (only once)
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });

    // ✅ Shop embed dropdown controller
    (function(){
      const frame = document.getElementById("shopFrame");
      const sel = document.getElementById("vendorSelect");
      const go = document.getElementById("vendorGo");

      function setSrc(url){
        if (!url || !frame) return;
        frame.src = url;
        // remember selection on refresh
        location.hash = "shop=" + encodeURIComponent(url);
      }

      if (sel){
        sel.addEventListener("change", () => setSrc(sel.value));
      }

      // restore from hash
      const m = location.hash.match(/shop=([^&]+)/);
      if (m && m[1] && sel){
        const url = decodeURIComponent(m[1]);
        const opt = Array.from(sel.options).find(o => o.value === url);
        if (opt) sel.value = url;
        setSrc(url);
      }
    })();
  </script>
