<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Shop</title>
  <meta name="description" content="Shop Friends + Family via Square." />

  <link rel="stylesheet" href="css/shop.css" />
  <link rel="stylesheet" href="css/subpages.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="subpage shop-page">

  <!-- ✅ Global header injected here -->
  <div id="header"></div>

  <main class="wrap">

    <section class="box page-head">
      <h1 class="page-title">SHOP</h1>
      <p class="subcopy">online exclusives ❤️</p>
    </section>
<br />
<!-- ✅ Shop sub menu (toggles embed src) -->
<section class="box shop-subnav" aria-label="Shop categories">
  <nav class="shop-tabs">
    <button class="shop-tab is-active" type="button"
      data-src="https://friends-and-fam-llc.square.site/">
      All
    </button>
    
 <button class="shop-tab" type="button"
      data-src="https://friends-and-fam-llc.square.site/shop/01-mimimarie/LFWT6GELYCL23VDEY3YTERV7?page=1&limit=30&sort_by=category_order&sort_order=asc">
      01 mimimarie
    </button>
    
    <button class="shop-tab" type="button"
      data-src="https://friends-and-fam-llc.square.site/shop/an-afternoon-affair/E3UYTY6EOBVFLFAEB263DZD6?page=1&limit=30&sort_by=category_order&sort_order=asc">
      An Afternoon Affair
    </button>
    
    <button class="shop-tab" type="button"
      data-src="https://friends-and-fam-llc.square.site/shop/ariana-thrifts/EDODRZGTTQ5TIGNH6YCOV2MM?page=1&limit=30&sort_by=category_order&sort_order=asc">
      ariana thrifts
    </button>
        
    <button class="shop-tab" type="button"
      data-src="https://friends-and-fam-llc.square.site/shop/benny-enzo/GXOQ77QYUCDQ5XOXRQIVQFRH?page=1&limit=30&sort_by=category_order&sort_order=asc">
      Benny Enzo
    </button>
  </nav>
</section>

<!-- ✅ Embed in a box -->
<section class="box shop-embed" aria-label="Shop embed">
  <iframe
    id="shopFrame"
    class="square-frame"
    src="https://friends-and-fam-llc.square.site/"
    title="Friends + Family Shop (Square)"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</section>
<br />
    <!-- ✅ Fallback button (if embed is blocked) -->
    <section class="box shop-fallback" aria-label="Shop link fallback">
      <p style="margin:0 0 10px;">
        If the shop doesn’t load here, Square is blocking embeds.
      </p>
      <a class="btn-primary" href="https://friends-and-fam-llc.square.site/" target="_blank" rel="noopener">
        OPEN SHOP IN NEW TAB
      </a>
    </section>

  </main>

  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <script>
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>
<script>
  // Header/footer partials (keep yours as-is)
  fetch("partials/header.html")
    .then(res => res.text())
    .then(html => { document.getElementById("header").innerHTML = html; });

  fetch("partials/footer.html")
    .then(res => res.text())
    .then(html => { document.getElementById("footer").innerHTML = html; });

  // ✅ Shop embed toggler
  (function(){
    const frame = document.getElementById("shopFrame");
    const tabs = document.querySelectorAll(".shop-tab");

    function setActive(btn){
      tabs.forEach(t => t.classList.remove("is-active"));
      btn.classList.add("is-active");
    }

    function setSrc(url, btn){
      if (!url || !frame) return;
      frame.src = url;
      if (btn) setActive(btn);

      // ✅ optional: remember selection on refresh
      // encode URL into hash
      location.hash = "shop=" + encodeURIComponent(url);
    }

    // click handlers
    tabs.forEach(btn => {
      btn.addEventListener("click", () => {
        setSrc(btn.dataset.src, btn);
      });
    });

    // ✅ on load: if hash exists, restore it + highlight matching tab
    const m = location.hash.match(/shop=([^&]+)/);
    if (m && m[1]) {
      const url = decodeURIComponent(m[1]);
      const matchBtn = Array.from(tabs).find(b => b.dataset.src === url);
      setSrc(url, matchBtn || tabs[0]);
    }
  })();
</script>
</body>
</html>
