<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Shop</title>
  <meta name="description" content="Shop Friends + Family via Square." />

  <link rel="stylesheet" href="css/shop.css" />
  <link rel="stylesheet" href="css/subpages.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="subpage shop-page">

  <!-- ✅ Global header injected here -->
  <div id="header"></div>

  <main class="wrap">

    <section class="box page-head">
      <h1 class="page-title">SHOP</h1>
      <p class="subcopy">online exclusives ❤️</p>
    </section>

    <br />

    <!-- ✅ Vendor dropdown (MySpace style box) -->
    <section class="box shop-subnav" aria-label="Shop vendors">
      <div class="shop-subnav-row">
        <label class="shop-label" for="vendorSelect">Vendor:</label>

        <!-- ✅ MANUAL VENDOR LIST (no /api/vendors dependency) -->
        <select id="vendorSelect" class="shop-select classic-select" aria-label="Select vendor">
          <option value="">All Stores</option>

          <option value="LFWT6GELYCL23VDEY3YTERV7">01 Mimimarie🌀</option>
          <option value="E3UYTY6EOBVFLFAEB263DZD6">An Afternoon Affair</option>
          <option value="EDODRZGTTQ5TIGNH6YCOV2MM">Ariana Thrifts</option>
          <option value="GXOQ77QYUCDQ5XOXRQIVQFRH">BENNY ENZ0❗️</option>
          <option value="4N74PQ4TBKQTHG2YDWZHD4D5">Bohde</option>
          <option value="6F5WHH5FJ2FAS4QOX7XMLLGA">CAPO</option>
          <option value="YLAE2MTU3SU4MRSLKUCN7NYW">ELANDA</option>
          <option value="YMPJEBO4G5FKCCW2Z62SAJIG">Female Hysteria</option>
          <option value="SDAXRCTTTSBONODN7IYFFRJG">Follow the Thread</option>
          <option value="2ZOUNZWHTFABY3XNEKGZNLIE">Ghostwriter</option>
          <option value="MMJIMSHO4M4XD6UVKPJIXCQ2">High Society</option>
          <option value="63LS37BKUP4H5B4JUDSPW74U">Kickoutsoul</option>
          <option value="3FPOFHGP7JNKGURXF5ICX2ZE">Lady of Lizard</option>
          <option value="5I5QKHWQZ47K4EBDR2DGSD34">LoveGrove</option>
          <option value="6WFEGT5JWWLNMLNL43757HO3">Maia🩷</option>
          <option value="MOOOT4SNHFKXKSA3XFARAOUC">Meera☘️</option>
          <option value="SJSM5WA7JLDCRSCZOGKGAW2U">RUA</option>
          <option value="I22VCEFCQ3W526B7VSBC5TVC">StrawbKiwi</option>
          <option value="Y7WMQIMANKR3L6MM6CM5GXSQ">Turbine</option>
        </select>

        <button id="checkoutBtn" class="btn-primary" type="button">
          Checkout (<span id="cartCount">0</span>)
        </button>
      </div>
    </section>

    <br />

    <!-- ✅ Products in a box -->
    <section class="box shop-products" aria-label="Products">
      <div id="shopStatus" class="shop-status">Loading shop…</div>
      <div id="productGrid" class="product-grid" hidden></div>
    </section>

    <br />

    <!-- ✅ Fallback button -->
    <section class="box shop-fallback" aria-label="Shop link fallback">
      <p style="margin:0 0 10px;">
        If the shop doesn’t load here, open it directly:
      </p>
      <a class="btn-primary" href="https://friends-and-fam-llc.square.site/" target="_blank" rel="noopener">
        OPEN SHOP IN NEW TAB
      </a>
    </section>

  </main>

  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <script>
    // ✅ Load shared header/footer partials (only once)
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>

<script>
(function(){
  // same-origin API (recommended)
  const API_BASE = "";

  const vendorSelect = document.getElementById("vendorSelect");
  const statusEl = document.getElementById("shopStatus");
  const grid = document.getElementById("productGrid");
  const cartCount = document.getElementById("cartCount");
  const checkoutBtn = document.getElementById("checkoutBtn");

  const cart = new Map(); // variationId -> { variationId, name, quantity }

  function setStatus(msg){
    statusEl.textContent = msg;
    statusEl.hidden = false;
    grid.hidden = true;
  }
  function showGrid(){
    statusEl.hidden = true;
    grid.hidden = false;
  }
  function updateCartCount(){
    let n = 0;
    cart.forEach(v => n += v.quantity);
    cartCount.textContent = String(n);
  }

  // ✅ SAFER: handle APIs that return HTML error pages
  async function safeJsonFetch(url, opts){
    const r = await fetch(url, opts);
    const text = await r.text();

    let data = null;
    try { data = JSON.parse(text); } catch(e) {}

    if (!r.ok){
      const msg =
        (data && (data.error || data.message)) ||
        (text ? text.slice(0, 140).replace(/\s+/g, " ") : "Request failed");
      throw new Error(msg);
    }

    if (!data){
      throw new Error("API returned a non-JSON response.");
    }

    return data;
  }

  async function apiGet(path){
    return safeJsonFetch(API_BASE + path);
  }

  async function apiPost(path, body){
    return safeJsonFetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  }

  function productCard(p){
  const imgInner = p.imageUrl
    ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy">`
    : `<div class="ph" aria-hidden="true"></div>`;

  const price = p.priceText || "";
  const vid = p.defaultVariationId;

  // ✅ link to item page
  const href = `item.html?itemId=${encodeURIComponent(p.itemId)}${
    vendorSelect?.value ? `&vendor=${encodeURIComponent(vendorSelect.value)}` : ""
  }`;

  return `
    <article class="prod" data-vid="${vid || ""}">
      <a class="prod-link" href="${href}" style="text-decoration:none; color:inherit;">
        <div class="prod-img">${imgInner}</div>
        <div class="prod-meta">
          <div class="prod-name">${p.name}</div>
          <div class="prod-price">${price}</div>
        </div>
      </a>

      <div class="prod-meta" style="padding-top:0;">
        <button class="prod-btn" type="button" ${vid ? "" : "disabled"}>
          ${vid ? "Add to cart" : "Unavailable"}
        </button>
      </div>
    </article>
  `;
}

  async function loadVendors(){
    const data = await apiGet("/api/vendors");
    const vendors = data.vendors || [];

    vendors.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v.id;        // ✅ IMPORTANT: this must be the categoryId
      opt.textContent = v.name;
      vendorSelect.appendChild(opt);
    });
  }

  async function loadItems(categoryId){
    setStatus("Loading items…");

    const q = categoryId ? `?categoryId=${encodeURIComponent(categoryId)}` : "";
    const data = await apiGet("/api/items" + q);
    const items = data.items || [];

    grid.innerHTML = items.map(productCard).join("");
    showGrid();

    // add-to-cart handlers
    grid.querySelectorAll(".prod-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const card = btn.closest(".prod");
        const variationId = card?.dataset?.vid;
        const name = card.querySelector(".prod-name")?.textContent?.trim() || "Item";
        if(!variationId) return;

        const existing = cart.get(variationId);
        if (existing) existing.quantity += 1;
        else cart.set(variationId, { variationId, name, quantity: 1 });

        updateCartCount();
        btn.textContent = "Added ✓";
        setTimeout(() => btn.textContent = "Add to cart", 700);
      });
    });
  }

  vendorSelect.addEventListener("change", () => {
    const id = vendorSelect.value || "";
    // keep URL in sync so refresh/share keeps same vendor
    const u = new URL(location.href);
    if (id) u.searchParams.set("vendor", id);
    else u.searchParams.delete("vendor");
    history.replaceState({}, "", u.toString());

    loadItems(id);
  });

  checkoutBtn.addEventListener("click", async () => {
    if (cart.size === 0) return alert("Your cart is empty.");

    try {
      checkoutBtn.disabled = true;
      checkoutBtn.textContent = "Opening checkout…";

      const lineItems = Array.from(cart.values()).map(x => ({
        variationId: x.variationId,
        quantity: x.quantity
      }));

      const { url } = await apiPost("/api/checkout", { lineItems });
      window.open(url, "_blank", "noopener");
    } catch (e) {
      alert("Checkout failed: " + e.message);
    } finally {
      checkoutBtn.disabled = false;
      checkoutBtn.innerHTML = `Checkout (<span id="cartCount">${cartCount.textContent}</span>)`;
    }
  });

  (async function init(){
    try{
      // ✅ READ vendor from URL
      const vendorFromUrl = new URLSearchParams(location.search).get("vendor") || "";

      setStatus("Loading vendors…");
      await loadVendors();

      // ✅ If vendorFromUrl exists but isn't in the dropdown yet, add it (prevents mismatch)
      if (vendorFromUrl && !Array.from(vendorSelect.options).some(o => o.value === vendorFromUrl)){
        const opt = document.createElement("option");
        opt.value = vendorFromUrl;
        opt.textContent = "Selected Vendor";
        vendorSelect.appendChild(opt);
      }

      // ✅ Set dropdown + load correct items
      vendorSelect.value = vendorFromUrl;
      await loadItems(vendorFromUrl);

    } catch(e){
      setStatus(
        "Shop failed to load: " + e.message +
        " — try opening /api/vendors in a new tab to see the server error."
      );
    }
  })();
})();
</script>

</body>
</html>
