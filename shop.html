<!-- ✅ Products in a box -->
<section class="box shop-products" aria-label="Products">
  <div id="shopStatus" class="shop-status">Loading shop…</div>
  <div id="productGrid" class="product-grid" hidden></div>
</section>

<script>
(function(){
  // ✅ CHANGE THIS to your deployed Vercel domain if your site is not hosted on Vercel.
  // If your site IS on the same Vercel project, you can keep it "" (same-origin).
  const API_BASE = ""; // e.g. "https://your-project.vercel.app"

  const vendorSelect = document.getElementById("vendorSelect");
  const statusEl = document.getElementById("shopStatus");
  const grid = document.getElementById("productGrid");
  const cartCount = document.getElementById("cartCount");
  const checkoutBtn = document.getElementById("checkoutBtn");

  const cart = new Map(); // variationId -> { variationId, name, quantity }

  function setStatus(msg){
    statusEl.textContent = msg;
    statusEl.hidden = false;
    grid.hidden = true;
  }
  function showGrid(){
    statusEl.hidden = true;
    grid.hidden = false;
  }
  function updateCartCount(){
    let n = 0;
    cart.forEach(v => n += v.quantity);
    cartCount.textContent = String(n);
  }

  async function apiGet(path){
    const r = await fetch(API_BASE + path);
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "Request failed");
    return j;
  }
  async function apiPost(path, body){
    const r = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "Request failed");
    return j;
  }

  function productCard(p){
    const img = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy">` : `<div class="ph"></div>`;
    const price = p.priceText || "";
    const vid = p.defaultVariationId;

    return `
      <article class="prod" data-vid="${vid || ""}">
        <div class="prod-img">${img}</div>
        <div class="prod-meta">
          <div class="prod-name">${p.name}</div>
          <div class="prod-price">${price}</div>
          <button class="prod-btn" type="button" ${vid ? "" : "disabled"}>
            ${vid ? "Add to cart" : "Unavailable"}
          </button>
        </div>
      </article>
    `;
  }

  async function loadVendors(){
    const { vendors } = await apiGet("/api/vendors");
    // You can filter vendors here if Square has non-vendor categories.
    vendors.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v.id;
      opt.textContent = v.name;
      vendorSelect.appendChild(opt);
    });
  }

  async function loadItems(categoryId){
    setStatus("Loading items…");
    const q = categoryId ? `?categoryId=${encodeURIComponent(categoryId)}` : "";
    const { items } = await apiGet("/api/items" + q);

    grid.innerHTML = items.map(productCard).join("");
    showGrid();

    // button handlers
    grid.querySelectorAll(".prod-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const card = btn.closest(".prod");
        const variationId = card?.dataset?.vid;
        const name = card.querySelector(".prod-name")?.textContent?.trim() || "Item";
        if(!variationId) return;

        const existing = cart.get(variationId);
        if (existing) existing.quantity += 1;
        else cart.set(variationId, { variationId, name, quantity: 1 });

        updateCartCount();
        btn.textContent = "Added ✓";
        setTimeout(() => btn.textContent = "Add to cart", 700);
      });
    });
  }

  vendorSelect.addEventListener("change", () => {
    loadItems(vendorSelect.value);
  });

  checkoutBtn.addEventListener("click", async () => {
    if (cart.size === 0) return alert("Your cart is empty.");

    try {
      checkoutBtn.disabled = true;
      checkoutBtn.textContent = "Opening checkout…";

      const lineItems = Array.from(cart.values()).map(x => ({
        variationId: x.variationId,
        quantity: x.quantity
      }));

      const { url } = await apiPost("/api/checkout", { lineItems });
      window.open(url, "_blank", "noopener");
    } catch (e) {
      alert(e.message);
    } finally {
      checkoutBtn.disabled = false;
      checkoutBtn.innerHTML = `Checkout (<span id="cartCount">${cartCount.textContent}</span>)`;
    }
  });

  (async function init(){
    try{
      setStatus("Loading vendors…");
      await loadVendors();

      // load initial selection (All)
      await loadItems("");

    } catch(e){
      setStatus("Shop failed to load: " + e.message);
    }
  })();
})();
</script>

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });

    // ✅ Shop embed dropdown controller
    (function(){
      const frame = document.getElementById("shopFrame");
      const sel = document.getElementById("vendorSelect");
      const go = document.getElementById("vendorGo");

      function setSrc(url){
        if (!url || !frame) return;
        frame.src = url;
        // remember selection on refresh
        location.hash = "shop=" + encodeURIComponent(url);
      }

      if (sel){
        sel.addEventListener("change", () => setSrc(sel.value));
      }

      // restore from hash
      const m = location.hash.match(/shop=([^&]+)/);
      if (m && m[1] && sel){
        const url = decodeURIComponent(m[1]);
        const opt = Array.from(sel.options).find(o => o.value === url);
        if (opt) sel.value = url;
        setSrc(url);
      }
    })();
  </script>
