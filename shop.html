<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Shop</title>
  <meta name="description" content="Shop Friends + Family via Square." />

  <link rel="stylesheet" href="css/shop.css" />
  <link rel="stylesheet" href="css/subpages.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="subpage shop-page">

  <!-- ✅ Global header injected here -->
  <div id="header"></div>

  <main class="wrap">

    <section class="box page-head">
      <h1 class="page-title">SHOP</h1>
      <p class="subcopy">online exclusives ❤️</p>
    </section>

    <br />

    <!-- ✅ Shop dropdown (toggles embed src) -->
    <section class="box shop-subnav" aria-label="Shop by vendor">
      <div class="shop-subnav-title">Shop by Vendor</div>

      <div class="shop-controls">
        <label class="shop-label" for="vendorSelect">Choose a store:</label>

        <div class="shop-select-row">
          <select id="vendorSelect" class="shop-select">
            <option value="https://friends-and-fam-llc.square.site/">All Stores</option>

            <option value="https://friends-and-fam-llc.square.site/shop/01-mimimarie/LFWT6GELYCL23VDEY3YTERV7?page=1&limit=30&sort_by=category_order&sort_order=asc">
              01 mimimarie
            </option>

            <option value="https://friends-and-fam-llc.square.site/shop/an-afternoon-affair/E3UYTY6EOBVFLFAEB263DZD6?page=1&limit=30&sort_by=category_order&sort_order=asc">
              An Afternoon Affair
            </option>

            <option value="https://friends-and-fam-llc.square.site/shop/ariana-thrifts/EDODRZGTTQ5TIGNH6YCOV2MM?page=1&limit=30&sort_by=category_order&sort_order=asc">
              Ariana Thrifts
            </option>

            <option value="https://friends-and-fam-llc.square.site/shop/benny-enzo/GXOQ77QYUCDQ5XOXRQIVQFRH?page=1&limit=30&sort_by=category_order&sort_order=asc">
              Benny Enzo
            </option>

            <!-- ✅ add the remaining vendor URLs here (up to 19 total) -->
          </select>

          <button id="vendorGo" class="shop-go" type="button">GO</button>
        </div>
      </div>
    </section>

    <!-- ✅ Embed in a box -->
    <section class="box shop-embed" aria-label="Shop embed">
      <iframe
        id="shopFrame"
        class="square-frame"
        src="https://friends-and-fam-llc.square.site/"
        title="Friends + Family Shop (Square)"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </section>

    <br />

    <!-- ✅ Fallback button (if embed is blocked) -->
    <section class="box shop-fallback" aria-label="Shop link fallback">
      <p style="margin:0 0 10px;">
        If the shop doesn’t load here, Square is blocking embeds.
      </p>
      <a class="btn-primary" href="https://friends-and-fam-llc.square.site/" target="_blank" rel="noopener">
        OPEN SHOP IN NEW TAB
      </a>
    </section>

  </main>

  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <script>
    // ✅ Load shared header/footer partials (only once)
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });

    // ✅ Shop embed dropdown controller
    (function(){
      const frame = document.getElementById("shopFrame");
      const sel = document.getElementById("vendorSelect");
      const go = document.getElementById("vendorGo");

      function setSrc(url){
        if (!url || !frame) return;
        frame.src = url;
        // remember selection on refresh
        location.hash = "shop=" + encodeURIComponent(url);
      }

      if (sel){
        sel.addEventListener("change", () => setSrc(sel.value));
      }
      if (go && sel){
        go.addEventListener("click", () => setSrc(sel.value));
      }

      // restore from hash
      const m = location.hash.match(/shop=([^&]+)/);
      if (m && m[1] && sel){
        const url = decodeURIComponent(m[1]);
        const opt = Array.from(sel.options).find(o => o.value === url);
        if (opt) sel.value = url;
        setSrc(url);
      }
    })();
  </script>

</body>
</html>
