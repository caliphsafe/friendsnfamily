<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Events</title>
  <meta name="description" content="Friends + Family events and pop-ups." />
  <link rel="stylesheet" href="css/subpages.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="subpage events-page">

   <!-- ✅ Global header injected here -->
  <div id="header"></div>

  <main class="wrap">

    <!-- Page header -->
    <section class="box page-head">
      <h1 class="page-title">EVENTS</h1>
      <p class="status">
        <span class="online-dot" aria-hidden="true"></span>
        <strong>Status:</strong> tap-in • pop-ups • community
      </p>
      <p class="subcopy">
        Most recent flyers are at the top. Scroll for past events.
      </p>
    </section>

    <!-- Events feed -->
    <section class="events-feed" aria-label="Event flyers feed">

      <!-- MOST RECENT (top) -->
      <article class="box event-card" aria-label="Event flyer 1 (most recent)">
        <img
          class="event-flyer"
          src="img/events/flyer_01.png"
          alt="Event flyer 1"
          loading="lazy"
        />
      </article>

      <article class="box event-card" aria-label="Event flyer 2">
        <img
          class="event-flyer"
          src="img/events/flyer_02.png"
          alt="Event flyer 2"
          loading="lazy"
        />
      </article>

      <article class="box event-card" aria-label="Event flyer 3">
        <img
          class="event-flyer"
          src="img/events/flyer_03.png"
          alt="Event flyer 3"
          loading="lazy"
        />
      </article>

      <!-- Add more flyers by copying one of the cards above -->

    </section>
  </main>

  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <!-- ✅ Load shared header/footer partials -->
  <script>
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>

</body>
</html>
