<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family — Events</title>
  <meta name="description" content="Friends + Family events and pop-ups." />

  <!-- Page CSS -->
  <link rel="stylesheet" href="css/events.css" />
  <link rel="stylesheet" href="css/subpages.css" />

  <!-- Shared header/footer CSS -->
  <link rel="stylesheet" href="css/global.css" />
</head>

<body class="subpage events-page">

  <!-- ✅ GLOBAL HEADER -->
  <div id="header"></div>

  <main class="wrap">

    <!-- Page header -->
    <section class="box page-head">
      <h1 class="page-title">EVENTS</h1>
      <p class="subcopy">
        Most recent flyers are at the top. Scroll for past events.
      </p>
    </section>

    <!-- Events feed -->
    <section class="events-feed" aria-label="Event flyers feed">

      <article class="box event-card" aria-label="Event flyer 1 (most recent)">
        <img
          class="event-flyer"
          src="img/events/flyer_1.png"
          alt="Event flyer 1"
          loading="lazy"
        />
      </article>

      <article class="box event-card" aria-label="Event flyer 2">
        <img
          class="event-flyer"
          src="img/events/flyer_2.png"
          alt="Event flyer 2"
          loading="lazy"
        />
      </article>

      <article class="box event-card" aria-label="Event flyer 3">
        <img
          class="event-flyer"
          src="img/events/flyer_3.png"
          alt="Event flyer 3"
          loading="lazy"
        />
      </article>

      <article class="box event-card" aria-label="Event flyer 3">
        <img
          class="event-flyer"
          src="img/events/flyer_4.png"
          alt="Event flyer 4"
          loading="lazy"
        />
      </article>

      <article class="box event-card" aria-label="Event flyer 3">
        <img
          class="event-flyer"
          src="img/events/flyer_5.png"
          alt="Event flyer 5"
          loading="lazy"
        />
      </article>

      <article class="box event-card" aria-label="Event flyer 3">
        <img
          class="event-flyer"
          src="img/events/flyer_6.png"
          alt="Event flyer 6"
          loading="lazy"
        />
      </article>

    </section>

  </main>

  <!-- ✅ GLOBAL FOOTER -->
  <div id="footer"></div>

  <!-- ✅ PARTIAL LOADER -->
  <script>
    fetch("partials/header.html")
      .then(r => r.text())
      .then(html => document.getElementById("header").innerHTML = html);

    fetch("partials/footer.html")
      .then(r => r.text())
      .then(html => document.getElementById("footer").innerHTML = html);
  </script>

</body>
</html>
