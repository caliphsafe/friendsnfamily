<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family</title>
  <meta name="description" content="Friends + Family online thrift store. Shop by vendor, explore events, and more." />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Friends + Family Home">
      <img src="img/fnf.png" alt="friends + family" />
    </a>
  </header>

  <main class="page">
    <section class="panels" aria-label="Homepage panels">

      <div class="panel guest" aria-label="Guest check panel">
        <div class="panel-inner guest-stack">
          <img class="guest-img" src="img/header.png" alt="" />

          <div class="guest-nav-wrap" aria-label="Site navigation">
            <img class="nav-bg" src="img/nav.png" alt="" />

            <div class="nav-rail">
              <nav class="nav-overlay" aria-label="Primary navigation">
                <a href="index.html" class="nav-item" aria-label="Home"><img src="img/home.png" alt="Home"></a>
                <img class="nav-split" src="img/split.png" alt="">
                <a href="shop.html" class="nav-item" aria-label="Shop"><img src="img/shop.png" alt="Shop"></a>
                <img class="nav-split" src="img/split.png" alt="">
                <a href="events.html" class="nav-item" aria-label="Events"><img src="img/events.png" alt="Events"></a>
                <img class="nav-split" src="img/split.png" alt="">
                <a href="about.html" class="nav-item" aria-label="About"><img src="img/about.png" alt="About"></a>
                <img class="nav-split" src="img/split.png" alt="">
                <a href="faqs.html" class="nav-item" aria-label="FAQs"><img src="img/faqs.png" alt="FAQs"></a>
                <img class="nav-split" src="img/split.png" alt="">
                <a href="contact.html" class="nav-item" aria-label="Contact"><img src="img/contact.png" alt="Contact"></a>
              </nav>
            </div>
          </div>

          <img class="guest-img" src="img/body.png" alt="" />
        </div>
      </div>

      <div class="panel thanks" aria-label="Thank you panel with vendor links">
        <div class="panel-inner thanks-wrap">
          <img class="thanks-bg" src="img/stores_bg.png" alt="" />

         <div class="vendor-links">
  <nav class="vendor-list" aria-label="Stores">
    <a href="/vendors/dl-mimimarie">DL Mimimarie</a>
    <a href="/vendors/an-afternoon-affair">An Afternoon Affair</a>
    <a href="/vendors/ariana-thrifts">Ariana Thrifts</a>
    <a href="/vendors/benny-enzo">BENNY ENZO!</a>
    <a href="/vendors/blonde">Blonde</a>
    <a href="/vendors/capo">Capo</a>
    <a href="/vendors/elanda">ELANDA</a>
    <a href="/vendors/female-hysteria">Female Hysteria</a>
    <a href="/vendors/follow-me-thread">Follow Me Thread</a>
    <a href="/vendors/ghostwriter">Ghostwriter</a>
    <a href="/vendors/high-society">High Society</a>
    <a href="/vendors/kickoutsoul">Kickoutsoul</a>
    <a href="/vendors/lady-of-lizard">Lady of Lizard</a>
    <a href="/vendors/love-grove">Love Grove</a>
    <a href="/vendors/maia">Maia</a>
    <a href="/vendors/meera">Meera</a>
    <a href="/vendors/rua">Rua</a>
    <a href="/vendors/strawbkiwi">StrawbKiwi</a>
    <a href="/vendors/turbine">turbine</a>
  </nav>
</div>

        </div>
      </div>

    </section>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>© <span id="year"></span> Friends + Family</p>
        <p class="footer-links">
          <a href="shop.html">Shop</a>
          <span class="dot">•</span>
          <a href="events.html">Events</a>
          <span class="dot">•</span>
          <a href="contact.html">Contact</a>
        </p>
      </div>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
