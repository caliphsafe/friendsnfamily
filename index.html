<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends + Family</title>
  <meta name="description" content="Friends + Family online thrift store. Shop by vendor, explore events, and more." />

  <!-- ✅ Global shared styles (header/footer/boxes/footer bg + positioning) -->
  <link rel="stylesheet" href="css/global.css" />
  <!-- ✅ Homepage-only styles (vendor overlay + homepage layout only) -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ✅ Global header injected here -->
  <div id="header"></div>

  <main class="page">
    <section class="panels" aria-label="Homepage panels">
      <div class="panel thanks" aria-label="Thank you panel with vendor links">
        <div class="panel-inner thanks-wrap">
          <img class="thanks-bg" src="img/stores_bg.png" alt="Thank you" />

          <div class="vendor-links" aria-label="Vendor links">
            <div class="vendor-list">
              <a class="vendor-row" href="vendors/mimimarie.html" aria-label="Mimimarie">
                <img src="img/mimi.png" alt="Mimimarie">
              </a>

              <a class="vendor-row" href="vendors/an-afternoon-affair.html" aria-label="An Afternoon Affair">
                <img src="img/afternoon.png" alt="An Afternoon Affair">
              </a>

              <a class="vendor-row" href="vendors/ariana-thrifts.html" aria-label="Ariana Thrifts">
                <img src="img/ariana.png" alt="Ariana Thrifts">
              </a>

              <a class="vendor-row" href="vendors/benny-enzo.html" aria-label="Benny Enzo">
                <img src="img/benny.png" alt="Benny Enzo">
              </a>

              <a class="vendor-row" href="vendors/bonde.html" aria-label="Bonde">
                <img src="img/bonde.png" alt="Bonde">
              </a>

              <a class="vendor-row" href="vendors/capo.html" aria-label="Capo">
                <img src="img/capo.png" alt="Capo">
              </a>

              <a class="vendor-row" href="vendors/elanda.html" aria-label="Elanda">
                <img src="img/elanda.png" alt="Elanda">
              </a>

              <a class="vendor-row" href="vendors/female-hysteria.html" aria-label="Female Hysteria">
                <img src="img/hysteria.png" alt="Female Hysteria">
              </a>

              <a class="vendor-row" href="vendors/follow-the-thread.html" aria-label="Follow The Thread">
                <img src="img/follow.png" alt="Follow The Thread">
              </a>

              <a class="vendor-row" href="vendors/ghostwriter.html" aria-label="Ghostwriter">
                <img src="img/ghost.png" alt="Ghostwriter">
              </a>

              <a class="vendor-row" href="vendors/high-society.html" aria-label="High Society">
                <img src="img/society.png" alt="High Society">
              </a>

              <a class="vendor-row" href="vendors/kickoutsoul.html" aria-label="KickOutSoul">
                <img src="img/kick.png" alt="KickOutSoul">
              </a>

              <a class="vendor-row" href="vendors/lady-of-lizard.html" aria-label="Lady of Lizard">
                <img src="img/lizard.png" alt="Lady of Lizard">
              </a>

              <a class="vendor-row" href="vendors/love-grove.html" aria-label="Love Grove">
                <img src="img/grove.png" alt="Love Grove">
              </a>

              <a class="vendor-row" href="vendors/maia.html" aria-label="Maia">
                <img src="img/maia.png" alt="Maia">
              </a>

              <a class="vendor-row" href="vendors/meera.html" aria-label="Meera">
                <img src="img/meera.png" alt="Meera">
              </a>

              <a class="vendor-row" href="vendors/rua.html" aria-label="Rua">
                <img src="img/rua.png" alt="Rua">
              </a>

              <a class="vendor-row" href="vendors/strawbkiwi.html" aria-label="StrawbKiwi">
                <img src="img/strawbkiwi.png" alt="StrawbKiwi">
              </a>

              <a class="vendor-row" href="vendors/turbine.html" aria-label="Turbine">
                <img src="img/turbine.png" alt="Turbine">
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ✅ Global footer injected here -->
  <div id="footer"></div>

  <!-- ✅ Load shared header/footer partials (same as subpages) -->
  <script>
    fetch("partials/header.html")
      .then(res => res.text())
      .then(html => { document.getElementById("header").innerHTML = html; });

    fetch("partials/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>

</body>
</html>
