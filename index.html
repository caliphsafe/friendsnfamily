<script>
  fetch("partials/header.html")
    .then(res => res.text())
    .then(html => { document.getElementById("header").innerHTML = html; });

  fetch("partials/footer.html")
    .then(res => res.text())
    .then(html => { document.getElementById("footer").innerHTML = html; });

  /* ✅ FIX: make vendor links scale exactly with the rendered sheet width */
  (function(){
    const wrap = document.getElementById("thanksWrap");
    const bg = document.getElementById("thanksBg");
    if(!wrap || !bg) return;

    function setScale(){
      const w = bg.getBoundingClientRect().width || wrap.getBoundingClientRect().width;
      if(!w) return;

      // your design sheet is 830px wide
      const scale = w / 830;

      // set CSS var on the container so the overlay grid scales with it
      wrap.style.setProperty("--sheetScale", scale.toFixed(4));
    }

    window.addEventListener("resize", () => requestAnimationFrame(setScale));
    window.addEventListener("orientationchange", () => requestAnimationFrame(setScale));
    bg.addEventListener("load", setScale);

    setScale();
    setTimeout(setScale, 60);
  })();
</script>
